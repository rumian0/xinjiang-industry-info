name: 采集信息

# 每天北京时间 08:00 和 16:00 自动采集（UTC 00:00 和 08:00）
# 注：GitHub Actions 定时任务存在延迟，不能保证每次准点运行。
on:
  schedule:
    - cron: '0 0 * * *'   # 北京时间 08:00
    - cron: '0 8 * * *'   # 北京时间 16:00
  workflow_dispatch: {}    # 手动触发

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行采集程序
        run: |
          python collector/main.py

      - name: 检查数据文件
        run: |
          test -f data/articles.json
          echo "采集完成，数据文件存在"

      - name: 提交更新（仅在有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/articles.json; then
            echo "数据无变化，跳过提交"
          else
            git add data/articles.json
            git commit -m "chore: 自动采集更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
